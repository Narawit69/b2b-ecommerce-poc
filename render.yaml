# Render Blueprint Specification for B2B E-commerce Microservices
services:
  # 1. Category Service (CA)
  - type: web
    name: b2b-category-service
    runtime: node
    rootDir: services/category-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  # 2. Product Service (PD)
  - type: web
    name: b2b-product-service
    runtime: node
    rootDir: services/product-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  # 3. FileStory Service (Media Storage Gateway)
  - type: web
    name: b2b-filestory-service
    runtime: node
    rootDir: services/filestory-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  # 4. Frontend (Next.js Admin Dashboard)
  - type: web
    name: b2b-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_PD_API_URL
        fromService:
          type: web
          name: b2b-product-service
          property: host
      - key: NEXT_PUBLIC_CA_API_URL
        fromService:
          type: web
          name: b2b-category-service
          property: host
      - key: NEXT_PUBLIC_FILESTORY_API_URL
        fromService:
          type: web
          name: b2b-filestory-service
          property: host
